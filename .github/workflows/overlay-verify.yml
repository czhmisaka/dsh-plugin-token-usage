name: overlay-verify

# Keeps the extraction honest: overlay the two plugin packages onto a pinned
# deepseek-harness commit and run their focused suites. Update `HARNESS_REF`
# when the plugin adopts APIs from a newer harness.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # weekly: catch harness-side breakage early

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    env:
      HARNESS_REF: 252bd209568b2fe3eb75365fc1d4fac90155a17c
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Check out the pinned harness
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.HARNESS_REF }}
          path: harness

      - name: Overlay the plugin packages
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf harness/packages/llm/usage-ledger harness/packages/client/ui-usage
          cp -R plugin/packages/llm/usage-ledger harness/packages/llm/usage-ledger
          cp -R plugin/packages/client/ui-usage harness/packages/client/ui-usage

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: harness/pnpm-lock.yaml

      - name: Install workspace dependencies
        # The pinned base carries a theme package whose lockfile entries were
        # never committed; CI implies frozen-lockfile, so opt out explicitly.
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck (host + client faces)
        run: pnpm run typecheck

      - name: Focused plugin suites
        run: pnpm vitest run packages/llm/usage-ledger packages/client/ui-usage
